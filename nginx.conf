server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index taskpane.html;

    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'self' https://*.officeapps.live.com;" always;

    # Office Add-in requires permissive CORS
    add_header Access-Control-Allow-Origin * always;
    add_header Vary Origin always;

    location / {
        try_files $uri $uri/ /taskpane.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin * always;
    }

    # manifest.xml should not be cached
    location = /manifest.xml {
        add_header Cache-Control "no-cache, no-store";
        add_header Access-Control-Allow-Origin * always;
    }
}
