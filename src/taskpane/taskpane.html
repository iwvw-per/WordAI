<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAI</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <!-- 禁止浏览器缓存 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>

<body>
  <div id="app">
    <!-- 顶部 -->
    <header id="header">
      <nav class="tab-bar">
        <button class="tab-btn active" data-tab="actions" id="tab-actions">操作</button>
        <button class="tab-btn" data-tab="academic" id="tab-academic">学术</button>
        <button class="tab-btn" data-tab="settings" id="tab-settings">设置</button>
      </nav>
    </header>

    <!-- 未配置提示 -->
    <div id="config-banner" class="config-banner hidden">
      <p>请先完成 API 配置</p>
      <button class="btn btn-sm btn-primary" id="go-settings-btn">前往设置</button>
    </div>

    <!-- 操作页 -->
    <div id="page-actions" class="page active">
      <!-- 极速学术快捷操作台 (快捷唤出) -->
      <div id="quick-action-deck" class="quick-action-deck hidden">
        <div class="deck-header">
          <span class="deck-title">快捷操作</span>
          <button class="deck-close" id="btn-close-deck" title="关闭">×</button>
        </div>
        <div class="deck-body">
          <button class="deck-btn btn-polish" id="btn-deck-polish">
            <span class="btn-icon">✨</span>
            <span class="btn-text">AI 润色</span>
          </button>
          <button class="deck-btn btn-deai" id="btn-deck-deai">
            <span class="btn-icon">🎭</span>
            <span class="btn-text">AI 降AI</span>
          </button>
          <button class="deck-btn btn-cool" id="btn-deck-cool">
            <span class="btn-icon">❄️</span>
            <span class="btn-text">AI 降温</span>
          </button>
        </div>
      </div>

      <section class="section">
        <div id="action-grid" class="action-grid"></div>
        <!-- 内联状态条由 JS 动态插入 -->
      </section>

      <section class="section">
        <div class="custom-prompt-area">
          <textarea id="custom-prompt" placeholder="输入自定义指令... (Ctrl+Enter)" rows="2"></textarea>
          <button class="btn btn-primary btn-block" id="custom-run-btn">
            <span class="btn-icon">▶</span> 执行
          </button>
        </div>
      </section>

      <!-- 批量处理队列与滚动终端控制台（常驻） -->
      <section class="section" id="pipeline-console-section">
        <div class="pipeline-console" id="pipeline-console">
          <div class="console-header">
            <span class="console-title" id="pipeline-console-title">就绪</span>
            <span style="flex:1"></span>
            <button class="btn btn-xs btn-ghost" id="btn-clear-console" style="font-size:9px; padding:2px 6px; opacity:0.7;">清除</button>
          </div>
          <div class="console-body" id="pipeline-console-body">
            <div class="console-line system">就绪</div>
          </div>
        </div>
      </section>
    </div>

    <!-- 学术页 -->
    <div id="page-academic" class="page">
      <!-- 表格样式 -->
      <section class="section academic-section">
        <h2 class="section-title">表格样式</h2>
        <div class="academic-card">
          <div class="form-group">
            <label class="form-label" for="select-table-style">样式</label>
            <select id="select-table-style" class="form-input"></select>
            <div id="custom-style-wrap" class="hidden">
              <input type="text" id="input-custom-style" class="form-input" placeholder="样式名" style="margin-top:4px;" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="select-width-mode">宽度</label>
            <select id="select-width-mode" class="form-input">
              <option value="">不调整</option>
              <option value="window">自适应窗口</option>
              <option value="content">自适应内容</option>
              <option value="fixed">固定宽度</option>
            </select>
          </div>
          <div class="table-style-actions">
            <button class="btn btn-primary" id="btn-apply-table-style">应用</button>
            <button class="btn btn-ghost" id="btn-apply-all-tables">应用到全部</button>
          </div>
        </div>
      </section>
    </div>

    <!-- 设置页 -->
    <div id="page-settings" class="page">
      <section class="section">
        <div style="display:flex; gap:4px;">
          <button class="btn btn-ghost" id="theme-toggle-btn" style="flex:1">主题</button>
          <button class="btn btn-ghost" id="btn-backup-config" style="flex:1">备份配置</button>
          <button class="btn btn-ghost" id="btn-restore-config" style="flex:1">还原配置</button>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">API 配置</h2>
        <div class="form-group">
          <label class="form-label" for="api-endpoint">API 端点</label>
          <input type="url" id="api-endpoint" class="form-input" placeholder="https://api.openai.com" />
          <span class="form-hint">OpenAI 兼容格式（不含 /v1）</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="api-key">API Key</label>
          <div class="input-with-action">
            <input type="password" id="api-key" class="form-input" placeholder="sk-..." />
            <button class="btn btn-sm btn-ghost" id="toggle-key-btn">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="model-select">模型</label>
          <div class="input-with-action">
            <select id="model-select" class="form-input">
              <option value="">-- 获取模型列表 --</option>
            </select>
            <button class="btn btn-sm btn-primary" id="fetch-models-btn">🔄</button>
          </div>
          <div id="model-status" class="form-hint"></div>
        </div>
        <div class="form-group">
          <label class="form-label">
            温度 <span id="temperature-value" class="badge">0.7</span>
          </label>
          <input type="range" id="temperature-slider" class="form-range" min="0" max="2" step="0.1" value="0.7" />
          <div class="range-labels"><span>精确</span><span>创意</span></div>
        </div>
        <button class="btn btn-primary btn-block" id="test-connection-btn">
          <span class="btn-icon">🔗</span> 测试连接
        </button>
        <div id="connection-result" class="connection-result hidden"></div>
      </section>

      <section class="section">
        <h2 class="section-title">隐私与模型路由</h2>
        <div class="skip-rules">
          <label class="toggle-item">
            <input type="checkbox" id="privacy-mode-toggle" />
            <span class="toggle-slider"></span>
            <span class="toggle-label">隐私脱敏</span>
          </label>
          <label class="toggle-item">
            <input type="checkbox" id="model-routing-toggle" />
            <span class="toggle-slider"></span>
            <span class="toggle-label">模型路由</span>
          </label>
        </div>
        <div class="form-group">
          <label class="form-label" for="fast-model-input">快速模型</label>
          <select id="fast-model-input" class="form-input">
            <option value="">-- 默认模型 --</option>
          </select>
          <span class="form-hint">留空使用默认模型</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="quality-model-input">质量模型</label>
          <select id="quality-model-input" class="form-input">
            <option value="">-- 默认模型 --</option>
          </select>
          <span class="form-hint">学术任务优先使用</span>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">跳过规则</h2>
        <div class="skip-rules skip-grid">
          <label class="toggle-item"><input type="checkbox" id="skip-headings" checked /><span
              class="toggle-slider"></span><span class="toggle-label">标题</span></label>
          <label class="toggle-item"><input type="checkbox" id="skip-tables" checked /><span
              class="toggle-slider"></span><span class="toggle-label">表格</span></label>
          <label class="toggle-item"><input type="checkbox" id="skip-formulas" checked /><span
              class="toggle-slider"></span><span class="toggle-label">公式</span></label>
          <label class="toggle-item"><input type="checkbox" id="skip-crossrefs" checked /><span
              class="toggle-slider"></span><span class="toggle-label">交叉引用</span></label>
          <label class="toggle-item"><input type="checkbox" id="skip-images" checked /><span
              class="toggle-slider"></span><span class="toggle-label">图片</span></label>
          <label class="toggle-item"><input type="checkbox" id="skip-toc" checked /><span
              class="toggle-slider"></span><span class="toggle-label">目录</span></label>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">显示对比</h2>
        <div class="skip-rules">
          <label class="toggle-item">
            <input type="checkbox" id="diff-mode-toggle" />
            <span class="toggle-slider"></span>
            <span class="toggle-label">开启修订模式</span>
          </label>
        </div>
        <div class="form-group" style="margin-top:8px;">
          <label class="form-label" for="input-tracked-author">修订作者名</label>
          <input type="text" id="input-tracked-author" class="form-input" placeholder="默认 WordAI" />
        </div>
        <button class="btn btn-ghost btn-block" id="btn-accept-diff" style="margin-top:8px">接受全部修订</button>
      </section>

      <section class="section">
        <h2 class="section-title">并发控制</h2>
        <div class="form-group" style="margin-top: 8px;">
          <label class="form-label" style="display:flex; justify-content:space-between; align-items:center;">
            <span>并发任务数</span>
            <span id="concurrency-value" class="badge">1</span>
          </label>
          <input type="range" id="concurrency-slider" class="form-range" min="1" max="5" step="1" value="1" style="margin-top: 6px;" />
          <div class="range-labels" style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted); margin-top:2px;">
            <span>1</span>
            <span>5</span>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">
          提示词模板
          <button class="btn btn-sm btn-ghost" id="add-prompt-btn">＋</button>
        </h2>
        <div id="prompt-list" class="prompt-list"></div>
        <button class="btn btn-ghost btn-block btn-sm" id="reset-prompts-btn">↻ 恢复默认</button>
      </section>

      <section class="section">
        <h2 class="section-title">术语库</h2>
        <textarea id="terminology-bank-input" class="form-input" rows="4" placeholder="标准术语=别名1,别名2"></textarea>
        <button class="btn btn-primary btn-block btn-sm" id="save-terminology-bank-btn" style="margin-top:4px">保存术语库</button>
      </section>

      <section class="section">
        <h2 class="section-title">
          任务历史
          <button class="btn btn-sm btn-ghost" id="clear-task-history-btn">清空</button>
        </h2>
        <div id="task-history-list" class="compact-list"></div>
      </section>

      <footer class="settings-footer">
        <p>WordAI v1.3.0</p>
      </footer>
    </div>
  </div>

  <!-- 弹窗 -->
  <div id="prompt-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <h3 id="modal-title">编辑提示词</h3>
      <div class="form-group">
        <label class="form-label">名称</label>
        <input type="text" id="prompt-name" class="form-input" placeholder="如：润色" />
      </div>
      <div class="form-group">
        <label class="form-label">图标</label>
        <input type="text" id="prompt-icon" class="form-input" placeholder="✨" maxlength="4" />
      </div>
      <div class="form-group">
        <label class="form-label">颜色</label>
        <input type="color" id="prompt-color" class="form-input-color" value="#6366f1" />
      </div>
      <div class="form-group">
        <label class="form-label">提示词</label>
        <textarea id="prompt-text" class="form-input" rows="10" placeholder="输入内容..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="save-prompt-btn">保存</button>
        <button class="btn btn-ghost" id="cancel-prompt-btn">取消</button>
      </div>
    </div>
  </div>
  <!-- 配置备份/还原弹窗 -->
  <div id="config-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <h3 id="config-modal-title">配置备份</h3>
      <textarea id="config-modal-text" class="form-input" rows="10" placeholder="粘贴配置 JSON"></textarea>
      <p style="font-size:10px; color:var(--text-secondary); margin-top:4px;">包含 API Key 等敏感信息，请妥善保管</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="config-modal-cancel">取消</button>
        <button class="btn btn-primary" id="config-modal-ok">确定</button>
      </div>
    </div>
  </div>
</body>

</html>
